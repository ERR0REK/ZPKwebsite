  <!-- Ably Realtime (UMD build) — ładowany jako gotowy plik, żeby omijać kompilację Babel przez CRA -->

       żeby window.Ably istniało zanim React się zamontuje (inaczej race condition). -->
  <script src="%PUBLIC_URL%/vendor/ably.min.js"></script>
  <!--
      Notice the use of %PUBLIC_URL% in the tags above.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  <title>Zjednoczona Polska Korona | Official Website</title>
